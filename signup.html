<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your PedalCity account to book bicycles, join guided tours, manage rentals, and download receipts.">
    <title>Sign Up | PedalCity Bicycle Rental & City Tours</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-topbar">
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<main class="auth-main">
    <div class="auth-card" style="max-width:480px;">
        <div style="position:absolute;top:-60px;right:-60px;width:160px;height:160px;background:rgba(13,148,136,0.07);border-radius:50%;filter:blur(32px);pointer-events:none;"></div>
        <div style="position:absolute;bottom:-40px;left:-40px;width:120px;height:120px;background:rgba(13,148,136,0.05);border-radius:50%;filter:blur(24px);pointer-events:none;"></div>

        <a href="index.html" class="auth-logo" aria-label="PedalCity Home">
            <img src="logo.svg" alt="PedalCity Logo" width="48" height="48">
            <div class="auth-logo-text">
                <span class="brand-top">PedalCity</span>
                <span class="brand-bottom">Bicycle Rental & City Tours</span>
            </div>
        </a>

        <div style="text-align:center;margin-bottom:1.75rem;">
            <h1 style="font-size:1.5rem;margin-bottom:0.375rem;">Create Your Account</h1>
            <p style="font-size:0.875rem;color:var(--text-muted);">Join 5,000+ riders exploring the city</p>
        </div>

        <div class="social-login-grid">
            <button class="social-btn social-google" title="Sign up with Google" aria-label="Sign up with Google">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            </button>
            <button class="social-btn social-apple" title="Sign up with Apple" aria-label="Sign up with Apple">
                <i class="fab fa-apple"></i>
            </button>
            <button class="social-btn social-facebook" title="Sign up with Facebook" aria-label="Sign up with Facebook">
                <i class="fab fa-facebook-f" style="color:#1877F2;"></i>
            </button>
        </div>

        <div class="divider">or sign up with email</div>

        <form onsubmit="event.preventDefault(); alert('Account created successfully! Welcome to PedalCity.'); window.location.href='dashboard.html';" id="signup-form">
            <div class="form-group">
                <label class="form-label" for="su-firstname">First Name</label>
                <input type="text" id="su-firstname" class="form-input" placeholder="First name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-lastname">Last Name</label>
                <input type="text" id="su-lastname" class="form-input" placeholder="Last name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-email">Email Address</label>
                <input type="email" id="su-email" class="form-input" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-phone">Phone Number</label>
                <input type="tel" id="su-phone" class="form-input" placeholder="+91 00000 00000" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="su-password" class="form-input" placeholder="Create a strong password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('su-password', this.querySelector('i'))">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="su-confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="su-confirm" class="form-input" placeholder="Re-enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('su-confirm', this.querySelector('i'))">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="agree-terms" required>
                    <label for="agree-terms" style="font-size:0.8125rem;">I agree to the <a href="#" class="link-primary">Terms of Service</a> and <a href="#" class="link-primary">Privacy Policy</a></label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg">Create Account</button>
        </form>

        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
            Already have an account? <a href="login.html" class="link-primary">Sign In</a>
        </p>
    </div>
</main>

<script src="components.js"></script>
<script>document.addEventListener('DOMContentLoaded', function() { initAuthPage(); });</script>
</body>
</html>
