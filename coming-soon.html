<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming soon to PedalCity — new routes, bikes, and features. Stay tuned!">
    <title>Coming Soon | PedalCity Bicycle Rental & City Tours</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .countdown-grid {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }
        .countdown-item {
            min-width: 80px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-2xl);
            padding: 1.25rem 1rem;
        }
        .countdown-value {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 2.25rem;
            color: var(--primary);
            line-height: 1;
        }
        .countdown-label {
            font-size: 0.6875rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.375rem;
        }
        .progress-bar-wrapper {
            max-width: 400px;
            margin: 0 auto 1.5rem;
        }
        .progress-bar-bg {
            height: 6px;
            background: var(--border-light);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 72%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-full);
            animation: pulse-width 2s ease-in-out infinite;
        }
        @keyframes pulse-width {
            0%,100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="fullscreen-page">

<div class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="PedalCity Home">
        <img src="logo.svg" alt="PedalCity Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;">
        <div class="nav-logo-text">
            <span class="brand-top">PedalCity</span>
            <span class="brand-bottom">Bicycle Rental & City Tours</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<div class="fullscreen-content">
    <div style="max-width:600px;width:100%;margin:0 auto;">
        <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;margin:0 auto 1.75rem;animation:float 3s ease-in-out infinite;">
            <i class="fas fa-bicycle" style="font-size:2rem;color:#fff;"></i>
        </div>

        <h1 style="font-size:clamp(1.75rem,4vw,2.5rem);margin-bottom:0.75rem;">Something Exciting is Coming</h1>
        <p style="font-size:1.0625rem;color:var(--text-muted);max-width:480px;margin:0 auto 2rem;line-height:1.7;">We're working on new routes, bike models, and features to make your cycling experience even better. Stay tuned!</p>

        <!-- Countdown -->
        <div class="countdown-grid" id="countdown">
            <div class="countdown-item">
                <div class="countdown-value" id="cd-days">12</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-hours">08</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-mins">45</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-secs">30</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
            <p style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;">72% Complete</p>
        </div>

        <!-- Notify Form -->
        <form onsubmit="event.preventDefault(); alert('You\'re on the list! We\'ll notify you when we launch.'); this.reset();" style="display:flex;gap:0.75rem;max-width:420px;margin:0 auto 2rem;flex-wrap:wrap;">
            <input type="email" class="form-input" placeholder="Enter your email" required style="flex:1;min-width:200px;">
            <button type="submit" class="btn btn-primary">Notify Me</button>
        </form>

        <div style="display:flex;gap:0.875rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Back to Home</a>
            <a href="fleet.html" class="btn btn-outline btn-sm"><i class="fas fa-bicycle"></i> Browse Fleet</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    initAuthPage();
    // Countdown timer (demo: 12 days from now)
    const launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 12);
    launchDate.setHours(launchDate.getHours() + 8);

    function updateCountdown() {
        const now = new Date();
        const diff = launchDate - now;
        if (diff <= 0) return;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
});
</script>
</body>
</html>
